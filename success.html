<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordine Inviato! | Kebab Tropical</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #ff8c00; --dark: #1a1a1a; --bg: #f4f4f7; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .success-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        .icon-circle {
            width: 80px; height: 80px;
            background-color: #e8f5e9;
            color: #2e7d32;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
        }
        h1 { color: var(--primary); margin-bottom: 10px; text-transform: uppercase; }
        p { color: #666; line-height: 1.6; margin-bottom: 30px; }
        
        .btn-home {
            background-color: var(--dark);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            transition: 0.2s;
        }
        .btn-home:hover { transform: scale(1.05); background-color: var(--primary); }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-circle">
            <i class="fas fa-check"></i>
        </div>
        <h1>Ordine Ricevuto!</h1>
        <p>Grazie! Il tuo ordine è stato inviato correttamente al banco.</p>
        <p style="font-weight: bold; color: var(--dark);">
            Controlla la tua Email o WhatsApp:<br>
            Ti confermeremo l'orario di ritiro a breve.
        </p>
        
        <a href="/" class="btn-home">TORNA AL MENÙ</a>
    </div>

</body>
</html>
