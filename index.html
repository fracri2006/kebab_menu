<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kebab Tropical | Ordina Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #ff8c00; --dark: #1a1a1a; --gray: #777; --bg: #f4f4f7; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg); color: var(--dark); padding-bottom: 100px; }
        
        /* HEADER */
        header { background-color: var(--dark); color: white; padding: 30px 20px; text-align: center; border-bottom: 5px solid var(--primary); }
        header h1 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
        .category-title { margin: 30px 0 15px; font-size: 1.2rem; text-transform: uppercase; border-left: 4px solid var(--primary); padding-left: 10px; color: var(--dark); display: flex; align-items: center; gap: 10px; }
        
        /* CARD PRODOTTO (Cliccabile) */
        .menu-item { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .menu-item:hover { border-color: var(--primary); transform: translateY(-2px); }
        .item-header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 5px; }
        .item-price { color: var(--primary); }
        .item-description { font-size: 0.85rem; color: #666; }
        
        /* PULSANTE CARRELLO FLUTTUANTE */
        #cart-btn {
            position: fixed; bottom: 20px; right: 20px;
            background-color: var(--primary); color: white;
            padding: 15px 25px; border-radius: 50px;
            font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 10px; cursor: pointer; z-index: 1000;
        }

        /* MODAL (Finestre Popup) */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); align-items: flex-end; /* Mobile style */
        }
        .modal-content {
            background-color: #fff; width: 100%; max-width: 600px; margin: auto;
            border-radius: 20px 20px 0 0; padding: 25px; position: relative;
            max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from {transform: translateY(100%);} to {transform: translateY(0);} }

        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; }
        
        /* STILE CHECKBOX INGREDIENTI */
        .ingredient-group { margin: 15px 0; }
        .ingredient-title { font-weight: bold; margin-bottom: 10px; display: block; color: var(--primary); }
        .checkbox-label {
            display: flex; align-items: center; padding: 10px; border: 1px solid #eee;
            border-radius: 8px; margin-bottom: 8px; cursor: pointer;
        }
        .checkbox-label input { margin-right: 10px; transform: scale(1.2); accent-color: var(--primary); }

        /* CARRELLO LISTA */
        .cart-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .cart-item-title { font-weight: bold; }
        .cart-item-mods { font-size: 0.8rem; color: #666; margin-top: 5px; }
        .remove-item { color: red; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }

        /* FORM DATI */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        
        .action-btn {
            width: 100%; padding: 15px; background-color: var(--dark); color: white;
            border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>KEBAB TROPICAL</h1>
    <p>Tocca i prodotti per modificare gli ingredienti</p>
</header>

<div class="container" id="menu-container">
    </div>

<div id="cart-btn" onclick="openCart()">
    <i class="fas fa-shopping-cart"></i>
    <span id="cart-count">0</span> Ordina (€<span id="cart-total">0.00</span>)
</div>

<div id="product-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('product-modal')">&times;</span>
        <h2 id="modal-title">Nome Prodotto</h2>
        <p id="modal-price" style="color: var(--primary); font-weight: bold; margin-bottom: 20px;">€0.00</p>
        
        <div id="ingredients-section">
            </div>

        <button class="action-btn" onclick="addToCart()">AGGIUNGI ALL'ORDINE</button>
    </div>
</div>

<div id="cart-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('cart-modal')">&times;</span>
        <h2>Il tuo Ordine</h2>
        <div id="cart-items-container" style="margin-bottom: 20px; max-height: 300px; overflow-y: auto;">
            <p>Il carrello è vuoto.</p>
        </div>
        <div style="text-align: right; font-weight: bold; font-size: 1.2rem; margin-bottom: 20px;">
            Totale: €<span id="modal-cart-total">0.00</span>
        </div>

        <form name="ordine-kebab" method="POST" data-netlify="true" action="/success">
            <div class="form-group">
                <label>Nome e Cognome</label>
                <input type="text" name="nome" required placeholder="Es. Mario Rossi">
            </div>
            <div class="form-group">
                <label>Telefono (per conferma orario)</label>
                <input type="tel" name="telefono" required placeholder="Es. 333 1234567">
            </div>
            <div class="form-group">
                <label>Note aggiuntive / Orario preferito</label>
                <input type="text" name="note_cliente" placeholder="Es. Posso ritirare alle 20:00?">
            </div>
            
            <input type="hidden" name="riepilogo_ordine" id="order-summary">

            <button type="submit" class="action-btn" style="background-color: var(--primary);">INVIA ORDINE</button>
            <p style="font-size: 0.8rem; color: #777; margin-top: 10px; text-align: center;">
                Riceverai una conferma dell'orario via Email/SMS.
            </p>
        </form>
    </div>
</div>

<script>
    // --- 1. CONFIGURAZIONE PRODOTTI ---
    // Qui definisci i prodotti e i loro ingredienti base
    const products = [
        {
            category: "Kebab",
            items: [
                { id: 1, name: "Kebab Panino", price: 5.50, desc: "Pane, carne, verdure, salse", baseIngredients: ["Cipolla", "Insalata", "Crauti", "Cetrioli", "Pomodoro", "Salsa Yogurt", "Salsa Curry", "Salsa Piccante"] },
                { id: 2, name: "Piadina Kebab", price: 6.00, desc: "Piadina, carne, verdure, salse", baseIngredients: ["Cipolla", "Insalata", "Crauti", "Cetrioli", "Pomodoro", "Salsa Yogurt", "Salsa Curry", "Salsa Piccante"] },
                { id: 3, name: "Kebab Tropical", price: 7.00, desc: "Con ananas e patatine", baseIngredients: ["Cipolla", "Insalata", "Crauti", "Cetrioli", "Pomodoro", "Patatine Fritte", "Ananas", "Salse"] }
            ]
        },
        {
            category: "Hamburger",
            items: [
                { id: 4, name: "Classico 180gr", price: 10.00, desc: "Con patatine", baseIngredients: ["Cipolla", "Insalata", "Pomodoro", "Bacon", "Cheddar", "Salsa Burger"] },
                { id: 5, name: "Italiano 180gr", price: 10.00, desc: "Con patatine", baseIngredients: ["Insalata", "Pomodoro", "Provola", "Salsa BBQ"] }
            ]
        },
        {
            category: "Stuzzicheria",
            items: [
                { id: 6, name: "Patatine Fritte (Piccole)", price: 2.50, desc: "Porzione singola", baseIngredients: [] },
                { id: 7, name: "Mix Tropical (10pz)", price: 5.50, desc: "Misto fritti", baseIngredients: [] }
            ]
        }
    ];

    const freeAddons = ["Ketchup", "Maionese", "Salsa BBQ"]; // Salse aggiuntive gratis

    // --- 2. GENERAZIONE MENU HTML ---
    const container = document.getElementById('menu-container');
    
    products.forEach(cat => {
        container.innerHTML += `<div class="category-title">${cat.category}</div>`;
        cat.items.forEach(item => {
            // Convertiamo l'oggetto item in una stringa sicura per passarla alla funzione
            const itemData = encodeURIComponent(JSON.stringify(item));
            container.innerHTML += `
                <div class="menu-item" onclick="openProductModal('${itemData}')">
                    <div class="item-header">
                        <span class="item-name">${item.name}</span>
                        <span class="item-price">€${item.price.toFixed(2)}</span>
                    </div>
                    <p class="item-description">${item.desc}</p>
                </div>`;
        });
    });

    // --- 3. GESTIONE CARRELLO E MODAL ---
    let cart = [];
    let currentProduct = null;

    function openProductModal(itemData) {
        currentProduct = JSON.parse(decodeURIComponent(itemData));
        document.getElementById('modal-title').innerText = currentProduct.name;
        document.getElementById('modal-price').innerText = "€" + currentProduct.price.toFixed(2);
        
        const ingContainer = document.getElementById('ingredients-section');
        ingContainer.innerHTML = "";

        // Sezione Rimuovi (Solo se ci sono ingredienti base)
        if (currentProduct.baseIngredients.length > 0) {
            ingContainer.innerHTML += `<span class="ingredient-title">Rimuovi Ingredienti:</span>`;
            currentProduct.baseIngredients.forEach(ing => {
                ingContainer.innerHTML += `
                    <label class="checkbox-label">
                        <input type="checkbox" class="remove-ing" value="${ing}"> Senza ${ing}
                    </label>`;
            });
        }

        // Sezione Aggiungi Salse
        ingContainer.innerHTML += `<span class="ingredient-title" style="margin-top:20px">Aggiungi Gratis:</span>`;
        freeAddons.forEach(sauce => {
            ingContainer.innerHTML += `
                <label class="checkbox-label">
                    <input type="checkbox" class="add-ing" value="${sauce}"> + ${sauce}
                </label>`;
        });

        document.getElementById('product-modal').style.display = "flex";
    }

    function addToCart() {
        const removes = Array.from(document.querySelectorAll('.remove-ing:checked')).map(el => "NO " + el.value);
        const adds = Array.from(document.querySelectorAll('.add-ing:checked')).map(el => "+ " + el.value);
        
        const cartItem = {
            ...currentProduct,
            uniqueId: Date.now(), // ID univoco per permettere duplicati con modifiche diverse
            modifications: [...removes, ...adds]
        };

        cart.push(cartItem);
        updateCartUI();
        closeModal('product-modal');
    }

    function removeFromCart(uniqueId) {
        cart = cart.filter(item => item.uniqueId !== uniqueId);
        updateCartUI();
    }

    function updateCartUI() {
        // Aggiorna pulsante carrello
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById('cart-count').innerText = cart.length;
        document.getElementById('cart-total').innerText = total.toFixed(2);
        document.getElementById('modal-cart-total').innerText = total.toFixed(2);

        // Aggiorna lista nel modal e campo nascosto per email
        const listContainer = document.getElementById('cart-items-container');
        const hiddenInput = document.getElementById('order-summary');
        
        if (cart.length === 0) {
            listContainer.innerHTML = "<p>Il carrello è vuoto.</p>";
            hiddenInput.value = "";
            return;
        }

        listContainer.innerHTML = "";
        let summaryText = ""; // Testo per l'email

        cart.forEach(item => {
            const modsText = item.modifications.length > 0 ? `(${item.modifications.join(', ')})` : "";
            
            // HTML per il sito
            listContainer.innerHTML += `
                <div class="cart-item">
                    <div style="display:flex; justify-content:space-between;">
                        <span class="cart-item-title">${item.name}</span>
                        <span>€${item.price.toFixed(2)}</span>
                    </div>
                    <div class="cart-item-mods">${modsText}</div>
                    <div class="remove-item" onclick="removeFromCart(${item.uniqueId})">Rimuovi</div>
                </div>`;
            
            // Testo per l'email
            summaryText += `- 1x ${item.name} ${modsText} - €${item.price.toFixed(2)}\n`;
        });

        summaryText += `\nTOTALE: €${total.toFixed(2)}`;
        hiddenInput.value = summaryText;
    }

    function openCart() { document.getElementById('cart-modal').style.display = "flex"; }
    
    function closeModal(modalId) { document.getElementById(modalId).style.display = "none"; }

    // Chiudi modal cliccando fuori
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = "none";
        }
    }
</script>

</body>
</html>
